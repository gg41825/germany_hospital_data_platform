name: dbt CI

on:
  push:
  pull_request:

jobs:
  dbt-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthcare_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d healthcare_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: healthcare_ci
      PGSSLMODE: disable
      RAW_SCHEMA: raw_bka_ci
      DBT_SCHEMA: analytics_ci
      DBT_PROFILE: germany_hospital_data_platform
      DBT_TARGET: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt

      - name: Load BKA fixture into PostgreSQL raw schema
        run: python ingestion/load_bka_xml.py ingestion/fixtures/bka_ci_data.xml --raw-schema "${RAW_SCHEMA}"

      - name: Run dbt build
        working-directory: ./dbt
        run: dbt build --profiles-dir . --profile "${DBT_PROFILE}" --target "${DBT_TARGET}"

      - name: Generate dbt docs
        working-directory: ./dbt
        run: dbt docs generate --profiles-dir . --profile "${DBT_PROFILE}" --target "${DBT_TARGET}"
