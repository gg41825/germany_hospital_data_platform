germany_hospital_data_platform:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'postgres') }}"
      password: "{{ env_var('PGPASSWORD', 'postgres') }}"
      dbname: "{{ env_var('PGDATABASE', 'postgres') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: 4
      sslmode: "{{ env_var('PGSSLMODE', 'prefer') }}"
    prod:
      type: postgres
      host: "{{ env_var('PROD_PGHOST') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PROD_PGUSER') }}"
      password: "{{ env_var('PROD_PGPASSWORD') }}"
      dbname: "{{ env_var('PROD_PGDATABASE') }}"
      schema: "{{ env_var('DBT_PROD_SCHEMA', 'analytics_prod') }}"
      threads: 8
      sslmode: "{{ env_var('PGSSLMODE', 'require') }}"
